# ==================== POSTGRESQL PROFILE ====================
# To use PostgreSQL instead of H2:
# 1. Create a database: CREATE DATABASE clinicdb;
# 2. Update the URL, username, and password below
# 3. Run with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres

# ==================== DATABASE (PostgreSQL) ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/clinicdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=your_password_here

# ==================== JPA / HIBERNATE (PostgreSQL) ====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ==================== H2 CONSOLE (disable) ====================
spring.h2.console.enabled=false

# ==================== JWT ====================
jwt.secret=mySecretKeyForClinicAppThatIsAtLeast256BitsLongForHS256
jwt.expiration=86400000

# ==================== SWAGGER ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.clinic=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ==================== PAGINATION ====================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
