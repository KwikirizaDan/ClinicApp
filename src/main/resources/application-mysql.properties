# ==================== MYSQL PROFILE ====================
# To use MySQL instead of H2:
# 1. Create a database: CREATE DATABASE clinicdb;
# 2. Update the URL, username, and password below
# 3. Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#    OR set: spring.profiles.active=mysql in application.properties

# ==================== DATABASE (MySQL) ====================
spring.datasource.url=jdbc:mysql://localhost:3306/clinicdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_password_here

# ==================== JPA / HIBERNATE (MySQL) ====================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings (HikariCP - default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ==================== H2 CONSOLE (disable in production) ====================
spring.h2.console.enabled=false

# ==================== JWT ====================
jwt.secret=mySecretKeyForClinicAppThatIsAtLeast256BitsLongForHS256
jwt.expiration=86400000

# ==================== SWAGGER ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.clinic=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ==================== PAGINATION ====================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
